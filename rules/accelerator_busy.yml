# Busy % = DCGM_FI_DEV_GPU_UTIL (gauge, percent, from the DCGM exporter) averaged over 5m per accelerator.
# Macs: macmon_gpu_active_ratio (gauge, 0-1, from macmon serve) x 100, averaged over 5m.
groups:
  - name: accelerator-busy
    interval: 1m
    rules:
      - record: accelerator:busy_percent:avg5m
        expr: |
          avg by (accelerator) (
            label_replace(
              avg_over_time(DCGM_FI_DEV_GPU_UTIL{
                job="dcgm_exporter",
                accelerator=""
              }[5m]),
              "accelerator", "gpu-primary", "accelerator", "^$"
            )
          )
          or
          avg by (accelerator) (
            avg_over_time(DCGM_FI_DEV_GPU_UTIL{
              job="dcgm_exporter",
              accelerator="gpu-secondary"
            }[5m])
          )
          or
          avg by (accelerator) (
            avg_over_time(macmon_gpu_active_ratio{
              job="macmon",
              accelerator=~"mac-primary|mac-secondary"
            }[5m]) * 100
          )

      - alert: AcceleratorBusyMetricsMissing
        expr: |
          absent(accelerator:busy_percent:avg5m{accelerator="gpu-primary"})
          or absent(accelerator:busy_percent:avg5m{accelerator="gpu-secondary"})
          or absent(accelerator:busy_percent:avg5m{accelerator="mac-primary"})
          or absent(accelerator:busy_percent:avg5m{accelerator="mac-secondary"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Busy metrics missing for {{ $labels.accelerator }}"
          description: "No accelerator:busy_percent:avg5m series has been present for {{ $labels.accelerator }} for 15 minutes."

      - alert: AcceleratorUnderutilized
        expr: avg_over_time(accelerator:busy_percent:avg5m[6h]) < 50
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.accelerator }} busy percent is below 50%"
          description: "The 6-hour average busy percent for {{ $labels.accelerator }} is below 50%."
