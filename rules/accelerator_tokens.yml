# Token-based accelerator utilization KPI.
#
# accelerator:generation_tokens_per_second:rate1h uses 1h engine rates and a 5m router rate.
# Source accelerator labels take precedence; unlabeled vLLM and llama.cpp series default
# to gpu-primary and gpu-secondary respectively, and the router's MLX model defaults
# to mac-primary. The router can also emit the literal accelerator label "None", which
# the mac-primary branch treats like an unlabeled series. mac-secondary is reported in
# the rate metric and excluded from the utilization KPI. Router health-check tokens
# are excluded.
#
# accelerator:max_generation_tokens_per_second is the maximum generation rate the model serves at its
#   maximum concurrency with large contexts. provenance="measured" marks a benchmark result;
#   provenance="provisional" marks an estimate (single slot, short context, or an observed peak) until a
#   measured maximum-concurrency, large-context run replaces it.
#
# accelerator:token_utilization:ratio = rate1h / max. It stays as a secondary
# series; the underuse alert fires on the slot duty cycle in accelerator_slots.yml.
groups:
  - name: accelerator-tokens
    interval: 1m
    rules:
      - record: accelerator:generation_tokens_per_second:rate1h
        expr: |
          sum by (accelerator) (
            label_replace(
              rate(vllm:generation_tokens_total{job="llm_gpu_engine"}[1h]),
              "accelerator", "gpu-primary", "accelerator", "^$"
            )
            or
            label_replace(
              rate(llamacpp:tokens_predicted_total{job="llm_gpu_engine"}[1h]),
              "accelerator", "gpu-secondary", "accelerator", "^$"
            )
            or
            label_replace(
              rate(litellm_output_tokens_metric_total{job="llm_router", model="mlx-community/Qwen3.8-27B-4bit", team!="litellm-internal-health-check"}[5m]),
              "accelerator", "mac-primary", "accelerator", "^(None)?$"
            )
          )

      # 2026-11-06, both provisional lanes:
      # shortcut: provisional capacity, replace after the lane's load-and-serve probe
      - record: accelerator:provisional_max_generation_tokens_per_second
        expr: vector(41)
        labels:
          accelerator: gpu-secondary
          provenance: provisional

      - record: accelerator:provisional_max_generation_tokens_per_second
        expr: vector(41)
        labels:
          accelerator: mac-primary
          provenance: provisional

      - record: accelerator:max_generation_tokens_per_second
        # gpu-primary: measured maximum of 893 generation tokens per second, retained from #11 (2026-11-06).
        expr: |
          label_replace(
            label_replace(vector(893), "accelerator", "gpu-primary", "", ""),
            "provenance", "measured", "", ""
          )
          or accelerator:provisional_max_generation_tokens_per_second

      - record: accelerator:token_utilization:ratio
        expr: |
          accelerator:generation_tokens_per_second:rate1h{accelerator=~"gpu-primary|gpu-secondary|mac-primary"}
          / on (accelerator)
          accelerator:max_generation_tokens_per_second
