---
# The engine exposes classic histogram buckets at base names, without _bucket.
# Aggregate buckets before quantiles; never average per-instance percentiles.
groups:
  - name: llm-serving-latency
    interval: 15s
    rules:
      - record: llm:ttft_seconds:p50_5m
        expr: |
          histogram_quantile(0.50, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:time_to_first_token_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:ttft_seconds:p95_5m
        expr: |
          histogram_quantile(0.95, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:time_to_first_token_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:ttft_seconds:p99_5m
        expr: |
          histogram_quantile(0.99, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:time_to_first_token_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:itl_seconds:p50_5m
        expr: |
          histogram_quantile(0.50, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:inter_token_latency_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:itl_seconds:p95_5m
        expr: |
          histogram_quantile(0.95, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:inter_token_latency_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:itl_seconds:p99_5m
        expr: |
          histogram_quantile(0.99, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:inter_token_latency_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:e2e_seconds:p50_5m
        expr: |
          histogram_quantile(0.50, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:e2e_request_latency_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:e2e_seconds:p95_5m
        expr: |
          histogram_quantile(0.95, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:e2e_request_latency_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:e2e_seconds:p99_5m
        expr: |
          histogram_quantile(0.99, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:e2e_request_latency_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:queue_seconds:p95_5m
        expr: |
          histogram_quantile(0.95, sum by (accelerator, model, le) (
            label_replace(label_replace(label_join(
              rate(vllm:request_queue_time_seconds{
                job="llm_gpu_engine"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ))
        labels:
          backend: vllm

      - record: llm:ttft_seconds:avg5m
        expr: |
          sum by (accelerator, model) (
            label_replace(label_join(
              rate(litellm_llm_api_time_to_first_token_metric_sum{
                job="llm_router", api_provider!="hosted_vllm",
                team!="litellm-internal-health-check"
              }[5m]), "mapping", ";", "accelerator", "model"),
              "accelerator", "mac-primary", "mapping",
              "^;mlx-community/Qwen3[.]8-27B-4bit$")
          ) / (sum by (accelerator, model) (
            label_replace(label_join(
              rate(litellm_llm_api_time_to_first_token_metric_count{
                job="llm_router", api_provider!="hosted_vllm",
                team!="litellm-internal-health-check"
              }[5m]), "mapping", ";", "accelerator", "model"),
              "accelerator", "mac-primary", "mapping",
              "^;mlx-community/Qwen3[.]8-27B-4bit$")
          ) > 0)
        labels:
          backend: router

      - record: llm:goodput:ratio5m
        # Request share within the TTFT threshold, not token goodput.
        expr: |
          sum by (accelerator, model) (
            label_replace(label_replace(label_join(
              rate(vllm:time_to_first_token_seconds{
                job="llm_gpu_engine", le="2.5"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ) / (sum by (accelerator, model) (
            label_replace(label_replace(label_join(
              rate(vllm:time_to_first_token_seconds{
                job="llm_gpu_engine", le="+Inf"
              }[5m]), "source_accelerator", "", "accelerator"),
              "model", "$1", "model_name", "(.+)"),
              "accelerator", "gpu-primary", "accelerator", "^$")
          ) > 0)
        labels:
          backend: vllm
