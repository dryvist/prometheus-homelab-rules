---
# Run with: promtool test rules tests/llm_serving_router.test.yml
rule_files:
  - ../rules/llm_serving_latency.yml
  - ../rules/llm_serving_state.yml
evaluation_interval: 15s
fuzzy_compare: true
tests:
  - name: router uses request-weighted means and excludes duplicate traffic
    interval: 15s
    input_series:
      - series: >-
          litellm_llm_api_time_to_first_token_metric_sum{job="llm_router",
          model="mlx-community/Qwen3.8-27B-4bit",api_key_alias="a"}
        values: '0+15x20'
      - series: >-
          litellm_llm_api_time_to_first_token_metric_count{job="llm_router",
          model="mlx-community/Qwen3.8-27B-4bit",api_key_alias="a"}
        values: '0+15x20'
      - series: >-
          litellm_llm_api_time_to_first_token_metric_sum{job="llm_router",
          model="mlx-community/Qwen3.8-27B-4bit",accelerator="mac-primary",
          api_key_alias="b"}
        values: '0+75x20'
      - series: >-
          litellm_llm_api_time_to_first_token_metric_count{job="llm_router",
          model="mlx-community/Qwen3.8-27B-4bit",accelerator="mac-primary",
          api_key_alias="b"}
        values: '0+45x20'
      - series: >-
          litellm_llm_api_time_to_first_token_metric_sum{job="llm_router",
          model="v",api_provider="hosted_vllm"}
        values: '0+1500x20'
      - series: >-
          litellm_llm_api_time_to_first_token_metric_count{job="llm_router",
          model="v",api_provider="hosted_vllm"}
        values: '0+15x20'
      - series: >-
          litellm_llm_api_time_to_first_token_metric_sum{job="llm_router",
          model="mlx-community/Qwen3.8-27B-4bit",
          team="litellm-internal-health-check"}
        values: '0+1500x20'
      - series: >-
          litellm_llm_api_time_to_first_token_metric_count{job="llm_router",
          model="mlx-community/Qwen3.8-27B-4bit",
          team="litellm-internal-health-check"}
        values: '0+15x20'
      - series: >-
          litellm_llm_api_time_to_first_token_metric_sum{job="llm_router",
          model="idle"}
        values: '0x20'
      - series: >-
          litellm_llm_api_time_to_first_token_metric_count{job="llm_router",
          model="idle"}
        values: '0x20'
      - series: >-
          litellm_in_flight_requests{job="llm_router",model="cloud",team="one"}
        values: '2x20'
      - series: >-
          litellm_in_flight_requests{job="llm_router",model="cloud",team="two"}
        values: '3x20'
      - series: >-
          litellm_in_flight_requests{job="llm_router",
          model="mlx-community/Qwen3.8-27B-4bit",accelerator="mac-secondary"}
        values: '1x20'
      - series: >-
          litellm_in_flight_requests{job="llm_router",model="v",
          api_provider="hosted_vllm"}
        values: '100x20'
      - series: >-
          litellm_in_flight_requests{job="llm_router",model="cloud",
          team="litellm-internal-health-check"}
        values: '100x20'
      - series: >-
          litellm_proxy_total_requests_metric_total{job="llm_router",
          model="cloud",team="one"}
        values: '0+15x20'
      - series: >-
          litellm_proxy_total_requests_metric_total{job="llm_router",
          model="cloud",team="two"}
        values: '0+45x20'
      - series: >-
          litellm_proxy_failed_requests_metric_total{job="llm_router",
          model="cloud"}
        values: '0+15x20'
      - series: >-
          litellm_proxy_total_requests_metric_total{job="llm_router",model="v",
          api_provider="hosted_vllm"}
        values: '0+1500x20'
      - series: >-
          litellm_proxy_failed_requests_metric_total{job="llm_router",model="v",
          api_provider="hosted_vllm"}
        values: '0+1500x20'
      - series: >-
          litellm_proxy_total_requests_metric_total{job="llm_router",
          model="cloud",team="litellm-internal-health-check"}
        values: '0+1500x20'
      - series: >-
          litellm_proxy_failed_requests_metric_total{job="llm_router",
          model="cloud",team="litellm-internal-health-check"}
        values: '0+1500x20'
    promql_expr_test:
      - expr: llm:ttft_seconds:avg5m
        eval_time: 5m
        exp_samples:
          - labels: >-
              llm:ttft_seconds:avg5m{backend="router",
              accelerator="mac-primary",model="mlx-community/Qwen3.8-27B-4bit"}
            value: 1.5
      - expr: llm:requests_running
        eval_time: 5m
        exp_samples:
          - labels: 'llm:requests_running{backend="router",model="cloud"}'
            value: 5
          - labels: >-
              llm:requests_running{backend="router",accelerator="mac-secondary",
              model="mlx-community/Qwen3.8-27B-4bit"}
            value: 1
      - expr: llm:requests_per_second:rate1m
        eval_time: 5m
        exp_samples:
          - labels: >-
              llm:requests_per_second:rate1m{backend="router",model="cloud"}
            value: 4
      - expr: llm:errors_per_second:rate1m
        eval_time: 5m
        exp_samples:
          - labels: >-
              llm:errors_per_second:rate1m{backend="router",model="cloud"}
            value: 1
      - expr: llm:requests_waiting
        eval_time: 5m
        exp_samples: []
      - expr: llm:ttft_seconds:p95_5m
        eval_time: 5m
        exp_samples: []
